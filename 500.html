<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal System Error (500) | UrbanEase Smart City Portal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Inter:wght@400;600&display=swap">
  <style>
    :root {
      --error: #ef4444;
      --bg-primary: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(226, 232, 240, 0.8);
      --card-shadow: 0 8px 32px 0 rgba(148, 163, 184, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
      padding: 3rem 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .icon {
      font-size: 4rem;
      background: rgba(239, 68, 68, 0.08);
      color: var(--error);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--text-primary) 30%, var(--error) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 600;
    }
    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      background-color: #0f172a;
      color: white;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #1e293b;
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🛑</div>
    <h1>500</h1>
    <h2>Portal Exception Encountered</h2>
    <p>The municipal smart portal encountered an unexpected internal server failure. If this problem persists, please contact the city IT administration helpdesk.</p>
    <a href="index.html#/" class="btn">Return to City Hall</a>
  </div>
</body>
</html>
